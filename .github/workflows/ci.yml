name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser assets
        run: |
          node --check script.js
          node --check i18n.js
          node --check puzzle-core.js
          node -e "const fs=require('node:fs'); const html=fs.readFileSync('index.html','utf8'); if (html.includes('\\\\n    <script')) throw new Error('index.html contains a literal \\\\n before a script tag');"
      - name: Run puzzle-core tests
        run: node --test tests/*.test.js
