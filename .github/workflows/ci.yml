name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser assets
        run: |
          node --check script.js
          node --check i18n.js
          node --check puzzle-core.js
          if grep -Fq '\n    <script' index.html; then
            echo 'index.html contains a literal \n before a script tag' >&2
            exit 1
          fi
      - name: Run puzzle-core tests
        run: node --test tests/*.test.js
